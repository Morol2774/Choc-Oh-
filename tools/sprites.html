<main>
  <h1>Спрайты бонбонов</h1>

  <p>Нажмите кнопку, скачайте файлы и положите их в <code>images/bonbons/</code> с заменой.</p>
  <button id="go" type="button">Сгенерировать</button>
  <span id="status"></span>
  <div id="out"></div>
</main>
